[project]
name = "agent-main"
version = "0.1.0"
description = "From-scratch coding agent — progressive learning from bare loop to full multi-agent system"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.121.0",
    "html2text>=2025.4.15",
    "httpx>=0.28.1",
    "openai>=2.54.0",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names)
    "W",   # pycodestyle warnings
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear (common bugs)
    "SIM", # flake8-simplify (simplify code)
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
]
exclude = [
    "s01_loop.py",
    "s02_tools.py",
    "s03_permission.py",
    ".venv",
]

[tool.ruff.lint.per-file-ignores]
"agent.py" = ["E402"]  # sys.path.insert before project imports

[tool.ruff.lint.isort]
known-first-party = ["config", "harness", "tools", "loop"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
